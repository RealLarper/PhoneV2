<!doctype html><html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>MyPhone V4</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#111;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial;color:#111}body{display:flex;justify-content:center;align-items:center}.phone{width:min(430px,100vw);height:min(932px,100vh);background:#f2f2f7;position:relative;overflow:hidden}.screen{height:100%;overflow:auto;padding-bottom:90px}.status{position:absolute;top:12px;left:20px;right:20px;z-index:20;display:flex;justify-content:space-between;font-weight:700;font-size:14px}.island{position:absolute;z-index:21;top:9px;left:50%;transform:translateX(-50%);width:118px;height:34px;background:#000;border-radius:22px}.home{min-height:100%;padding:75px 18px 100px;background:linear-gradient(150deg,#dce6f3,#f7f7f8 55%,#d9dce2)}.time{font-size:52px;font-weight:300;margin:5px 4px}.date{margin:0 4px 15px;color:#555}.widgets{display:grid;grid-template-columns:1fr 1fr;gap:11px}.widget{background:#ffffffb8;backdrop-filter:blur(20px);border-radius:21px;padding:14px;min-height:110px}.small{font-size:12px;color:#777}.big{font-size:27px;font-weight:800;margin-top:8px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:19px 7px;margin-top:22px}.icon{border:0;background:none;text-align:center;font:inherit}.box{width:57px;height:57px;border-radius:15px;margin:auto auto 5px;display:flex;align-items:center;justify-content:center;color:white;font-weight:800;font-size:21px;box-shadow:0 3px 8px #0002}.icon span{font-size:11px}.v{background:#087f86}.p{background:#0873b9}.n{background:linear-gradient(135deg,#9d5cff,#6437d7)}.g{background:#333}.b{background:#3478f6}.gr{background:#34c759}.r{background:#ff3b30}.o{background:#ff9500}.pu{background:#af52de}.c{background:#32ade6}.bottom{position:absolute;bottom:0;left:0;right:0;height:82px;background:#ffffffdf;backdrop-filter:blur(20px);display:flex;justify-content:space-around;align-items:center;z-index:10;border-top:1px solid #ddd}.bottom button{border:0;background:none;font-size:10px;color:#555}.bottom b{display:block;font-size:21px;color:#111}.app{min-height:100%;padding-top:55px;background:#f2f2f7}.head{height:55px;display:flex;align-items:center;justify-content:space-between;padding:0 15px;position:sticky;top:0;background:#f2f2f7ed;backdrop-filter:blur(18px);z-index:5}.head h1{font-size:22px;margin:0}.back{border:0;background:none;color:#007aff;font-size:16px}.card{background:white;border-radius:18px;margin:10px 13px;padding:16px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.muted{color:#777;font-size:13px}.amount{font-size:32px;font-weight:850}.btn{border:0;border-radius:12px;padding:11px 14px;background:#007aff;color:white;font-weight:700}.secondary{background:#e9e9ee;color:#111}.tabs{display:flex;gap:8px;padding:8px 13px;overflow:auto}.tab{border:0;border-radius:99px;background:#e5e5ea;padding:8px 13px;white-space:nowrap}.active{background:#111;color:white}.hero{padding:20px 16px 25px;color:white;border-radius:0 0 25px 25px}.vhero{background:#087f86}.phero{background:linear-gradient(135deg,#0873b9,#003087)}.nhero{background:linear-gradient(145deg,#28104b,#11131a)}.item{display:flex;gap:11px;padding:12px 0;border-bottom:1px solid #eee}.pic{width:76px;height:76px;border-radius:12px;background:#ddd;display:flex;align-items:center;justify-content:center;font-size:28px}.asset{display:flex;align-items:center;gap:11px;padding:13px 0;border-bottom:1px solid #ffffff12}.coin{width:40px;height:40px;border-radius:50%;background:#ffffff14;display:flex;align-items:center;justify-content:center}.dark{background:#11131a;color:white;min-height:100%}.dark .head{background:#11131aed;color:white}.dark .card{background:#1b1e27}.dark .muted{color:#999}.search{margin:10px 13px;background:#e5e5ea;border-radius:12px;padding:10px;color:#777}.label{font-size:12px;color:#777;font-weight:650}.input{width:100%;padding:11px;border:1px solid #ddd;border-radius:12px;margin:5px 0 10px;font:inherit}.demo{text-align:center;color:#888;font-size:10px;padding:10px}.overlay{display:none;position:absolute;inset:0;background:#0007;z-index:30}.sheet{display:none;position:absolute;z-index:31;bottom:0;left:0;right:0;max-height:85%;overflow:auto;background:#f7f7f8;border-radius:25px 25px 0 0;padding:20px}.show{display:block}
</style></head><body><div class="phone"><div class="status"><span id="clock"></span><span>● ● ▰</span></div><div class="island"></div><div id="screen" class="screen"></div>
<div class="bottom"><button onclick="home()"><b>⌂</b>Home</button><button onclick="closet()"><b>▦</b>Closet</button><button onclick="pay()"><b>₽</b>Pay</button><button onclick="nova()"><b>◇</b>Nova</button><button onclick="control()"><b>⚙</b>Control</button></div><div id="ov" class="overlay" onclick="closeSheet()"></div><div id="sheet" class="sheet"></div></div>
<script>
const K='myphone_v4';const D={name:'Alex Rossi',bal:12480.5,pay:2480.3,user:'alex.rossi',followers:184,items:[['Nike Air Max 1',120,'👟','In vendita'],['The North Face Puffer',180,'🧥','In vendita'],['Jordan Hoodie',75,'👕','In vendita']],tx:[['Vendita Nike Air Max 1','Oggi',120],['Pagamento stipendio','30 set',1850],['Acquisto online','29 set',-74.9]],ptx:[['Pagamento ricevuto','Oggi',350],['Invio a Marco','Ieri',-50]],tokens:[['Solana','SOL',12.48,188.42,'◎'],['USD Coin','USDC',420,1,'$'],['Ethereum','ETH',.42,3820,'◆']]};let s=JSON.parse(localStorage.getItem(K)||'null')||structuredClone(D);const save=()=>localStorage.setItem(K,JSON.stringify(s));const eur=x=>new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(x);
function home(){let d=new Date();screen.innerHTML=`<div class="home"><div class="time">${d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})}</div><div class="date">${d.toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'})}</div><div class="widgets"><div class="widget"><div class="small">Saldo</div><div class="big">${eur(s.bal)}</div><div class="small">MyBank</div></div><div class="widget"><div class="small">Pay</div><div class="big">${eur(s.pay)}</div><div class="small">Saldo demo</div></div></div><div class="grid">${[['closet','V','v','Closet'],['pay','₽','p','Pay'],['nova','◇','n','Nova Wallet'],['control','⚙','g','Control'],['bank','€','gr','Banca'],['mail','✉','b','Mail'],['chat','●','gr','Chat'],['agenda','▦','r','Agenda'],['garage','🚗','o','Garage'],['casa','⌂','pu','Casa'],['lavoro','▣','c','Lavoro'],['note','✎','g','Note']].map(a=>`<button class="icon" onclick="${a[0]}()"><div class="box ${a[2]}">${a[1]}</div><span>${a[3]}</span></button>`).join('')}</div><div class="demo">MYPHONE V4 • SIMULAZIONE PRIVATA • dati inventati</div></div>`;clock()}
function clock(){clockEl=document.getElementById('clock');clockEl.textContent=new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})}setInterval(clock,30000);
function base(t,b,cl=''){screen.innerHTML=`<div class="app ${cl}"><div class="head"><button class="back" onclick="home()">‹ Home</button><h1>${t}</h1><button class="back" onclick="sheet('Menu demo')">•••</button></div>${b}</div>`}
function closet(){base('Closet',`<div class="hero vhero"><div class="muted" style="color:#dff">Saldo disponibile</div><div class="amount">${eur(s.bal)}</div><div style="margin-top:10px">@${s.user} · ${s.followers} follower</div></div><div class="tabs"><button class="tab active">Profilo</button><button class="tab">Armadio</button><button class="tab">Preferiti</button><button class="tab">Ordini</button></div><div class="search">⌕ Cerca articoli, marche, utenti</div><div class="card"><div class="row"><b>I tuoi articoli</b><button class="btn" onclick="newItem()">+ Inserisci</button></div>${s.items.map((x,i)=>`<div class="item"><div class="pic">${x[2]}</div><div style="flex:1"><b>${x[0]}</b><div class="muted">${x[3]}</div><b>${eur(x[1])}</b></div><button class="btn secondary" onclick="editItem(${i})">•••</button></div>`).join('')}</div><div class="card"><b>Attività</b>${s.tx.map(x=>`<div class="row" style="padding:11px 0;border-bottom:1px solid #eee"><span>${x[0]}<small class="muted" style="display:block">${x[1]}</small></span><b>${x[2]>=0?'+':''}${eur(x[2])}</b></div>`).join('')}</div><div class="demo">Closet è una simulazione. Nessuna vendita reale.</div>`)}
function pay(){base('Pay',`<div class="hero phero"><div>Saldo</div><div class="amount">${eur(s.pay)}</div><div style="margin-top:15px"><button class="btn" onclick="payAction('Invia')">Invia</button> <button class="btn secondary" onclick="payAction('Richiedi')">Richiedi</button></div></div><div class="tabs"><button class="tab active">Home</button><button class="tab">Attività</button><button class="tab">Wallet</button></div><div class="card"><div class="row"><b>Attività recenti</b><button class="back" onclick="allPay()">Vedi tutto</button></div>${s.ptx.map(x=>`<div class="row" style="padding:12px 0;border-bottom:1px solid #eee"><span>${x[0]}<small class="muted" style="display:block">${x[1]}</small></span><b>${x[2]>=0?'+':''}${eur(x[2])}</b></div>`).join('')}</div><div class="card"><b>Wallet</b><div style="padding:13px 0;border-bottom:1px solid #eee">Visa •••• 4821</div><div style="padding:13px 0">Conto bancario •••• 1930</div></div><div class="demo">Pay è una simulazione. Nessun pagamento reale.</div>`)}
function nova(){let total=s.tokens.reduce((a,x)=>a+x[2]*x[3],0);base('Nova Wallet',`<div class="dark"><div class="hero nhero"><div class="muted">Portfolio</div><div class="amount">$${total.toLocaleString('en-US',{maximumFractionDigits:2})}</div><div style="margin-top:15px"><button class="btn" onclick="toast('Buy simulato')">Buy</button> <button class="btn secondary" onclick="toast('Swap simulato')">Swap</button> <button class="btn secondary" onclick="toast('Send simulato')">Send</button></div></div><div class="tabs"><button class="tab active">Tokens</button><button class="tab">Activity</button><button class="tab">Explore</button></div><div class="card"><div class="row"><b>Your assets</b><button class="btn secondary" onclick="newToken()">+ Asset</button></div>${s.tokens.map((x,i)=>`<div class="asset"><div class="coin">${x[4]}</div><div style="flex:1"><b>${x[0]}</b><div class="muted">${x[2]} ${x[1]}</div></div><div><b>$${(x[2]*x[3]).toFixed(2)}</b><div class="muted">$${x[3].toLocaleString()}</div></div><button class="btn secondary" onclick="editToken(${i})">✎</button></div>`).join('')}</div><div class="card"><b>Activity</b><div class="asset"><span>Received SOL</span><span>+2.40 SOL</span></div><div class="asset"><span>Swap completed</span><span>0.18 SOL</span></div></div><div class="demo">Nova Wallet è una simulazione. Nessuna blockchain reale.</div></div>`,'dark')}
function control(){base('Control Center',`<div class="card"><b>Profilo</b><div class="label">Nome</div><input class="input" id="nm" value="${s.name}"><div class="label">Username Closet</div><input class="input" id="us" value="${s.user}"><div class="label">Follower</div><input class="input" id="fo" type="number" value="${s.followers}"><button class="btn" onclick="profileSave()">Salva</button></div><div class="card"><b>Saldi</b><div class="label">Saldo Closet / Banca</div><input class="input" id="ba" type="number" value="${s.bal}"><div class="label">Saldo Pay</div><input class="input" id="pa" type="number" value="${s.pay}"><button class="btn" onclick="balanceSave()">Salva</button></div><div class="card"><b>Gestione</b><p class="muted">Gli annunci e gli asset si modificano direttamente nelle rispettive app.</p><button class="btn secondary" onclick="reset()">Reset demo</button></div><div class="demo">Nessuna password, seed phrase o carta reale viene richiesta.</div>`)}
function profileSave(){s.name=nm.value;s.user=us.value;s.followers=+fo.value;save();control()}function balanceSave(){s.bal=+ba.value;s.pay=+pa.value;save();control()}
function newItem(){let n=prompt('Nome articolo','New Hoodie');if(!n)return;let p=+prompt('Prezzo','90');s.items.unshift([n,p,'📦','In vendita']);save();closet()}function editItem(i){let x=s.items[i],n=prompt('Nome',x[0]),p=prompt('Prezzo',x[1]),st=prompt('Stato',x[3]);if(n!==null)x[0]=n;if(p!==null)x[1]=+p;if(st!==null)x[3]=st;save();closet()}
function payAction(k){let p=+prompt('Importo demo','50');if(!p)return;if(k==='Invia')s.pay-=p;else s.pay+=p;s.ptx.unshift([k+' demo','Oggi',k==='Invia'?-p:p]);save();pay()}function allPay(){sheet('Tutta attività',s.ptx.map(x=>`<div class="card row"><span>${x[0]}<small class="muted">${x[1]}</small></span><b>${x[2]>=0?'+':''}${eur(x[2])}</b></div>`).join(''))}
function newToken(){let n=prompt('Nome','MemeCoin');if(!n)return;let t=prompt('Ticker','MEME'),q=+prompt('Quantità','1000'),p=+prompt('Prezzo USD','0.01');s.tokens.push([n,t,q,p,'●']);save();nova()}function editToken(i){let x=s.tokens[i],q=prompt('Quantità',x[2]),p=prompt('Prezzo USD',x[3]);if(q!==null)x[2]=+q;if(p!==null)x[3]=+p;save();nova()}
function sheet(title,body=''){document.getElementById('sheet').innerHTML=`<h2>${title}</h2>${body}<button class="btn" onclick="closeSheet()">Chiudi</button>`;ov.classList.add('show');document.getElementById('sheet').classList.add('show')}function closeSheet(){ov.classList.remove('show');document.getElementById('sheet').classList.remove('show')}function toast(x){sheet(x,'<p class="muted">Azione disponibile solo nella simulazione.</p>')}function reset(){if(confirm('Reset demo?')){s=structuredClone(D);save();home()}}
function bank(){base('MyBank',`<div class="card"><div class="muted">Saldo</div><div class="amount">${eur(s.bal)}</div></div><div class="card">${s.tx.map(x=>`<div class="row" style="padding:12px 0"><span>${x[0]}<small class="muted">${x[1]}</small></span><b>${x[2]>=0?'+':''}${eur(x[2])}</b></div>`).join('')}</div>`)}function generic(t,i,m,d){base(t,`<div class="card" style="text-align:center;padding:35px"><div style="font-size:50px">${i}</div><h2>${m}</h2><p class="muted">${d}</p><button class="btn" onclick="toast('Azione demo')">Apri</button></div>`)}
function mail(){generic('Mail','✉','Posta in arrivo','3 messaggi')}function chat(){generic('Chat','●','Conversazioni','12 chat')}function agenda(){generic('Agenda','▦','Oggi','2 appuntamenti')}function garage(){generic('Garage','🚗','BMW M4','Parcheggiata')}function casa(){generic('Casa','⌂','Casa','Milano • 3 locali')}function lavoro(){generic('Lavoro','▣','Stipendio','€ 1.850')}function note(){generic('Note','✎','La mia lista','Promemoria')}
home();
</script></body></html>
