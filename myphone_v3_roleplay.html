<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>MyPhone — Roleplay Simulator</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#111;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Arial,sans-serif;color:#111}
body{display:flex;justify-content:center;align-items:center;overflow:hidden}
.phone{width:min(430px,100vw);height:min(932px,100vh);background:#f5f5f7;position:relative;overflow:hidden}
@media(min-width:600px){.phone{border-radius:42px;box-shadow:0 0 0 8px #222,0 25px 80px #0009}}
.status{height:54px;padding:14px 22px 0;display:flex;justify-content:space-between;font-weight:700;font-size:14px;position:absolute;z-index:20;top:0;left:0;right:0;pointer-events:none}
.island{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:118px;height:34px;background:#000;border-radius:22px;z-index:21}
.screen{height:100%;overflow:auto;padding-bottom:88px;scroll-behavior:smooth}
.home{padding:78px 20px 100px;background:linear-gradient(180deg,#dfe7f4,#f7f7f8 45%,#d9dbe0);min-height:100%}
.widgets{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:22px}
.widget{background:#ffffffb8;backdrop-filter:blur(18px);border-radius:22px;padding:14px;min-height:118px;box-shadow:0 1px 2px #0001}
.widget .small{font-size:12px;color:#555}.widget .big{font-size:28px;font-weight:750;margin-top:10px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 10px}
.icon{border:0;background:none;color:#111;font:inherit;text-align:center;padding:0}
.iconbox{width:58px;height:58px;border-radius:15px;margin:auto auto 5px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:22px;box-shadow:0 3px 8px #0002}
.icon span{font-size:11px;text-shadow:0 1px 2px #fff}
.i-v{background:linear-gradient(135deg,#007782,#54a8b0)} .i-p{background:#0070ba}.i-ph{background:linear-gradient(135deg,#ab5cff,#6d3fe6)}
.i-gray{background:#333}.i-blue{background:#3478f6}.i-green{background:#34c759}.i-red{background:#ff3b30}.i-orange{background:#ff9500}.i-purple{background:#af52de}.i-cyan{background:#32ade6}
.app{min-height:100%;background:#f6f6f8;padding-top:66px}
.apphead{padding:10px 18px 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#f6f6f8eF;backdrop-filter:blur(16px);z-index:5}
.apphead h1{font-size:30px;margin:0}.back{border:0;background:none;font-size:16px;color:#007aff}
.card{background:#fff;border-radius:18px;margin:10px 14px;padding:16px;box-shadow:0 1px 3px #0000000d}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.muted{color:#777;font-size:13px}.title{font-weight:750}.amount{font-weight:800;font-size:24px}
.btn{border:0;border-radius:13px;padding:12px 15px;background:#007aff;color:white;font-weight:700}.btn.secondary{background:#e9e9ee;color:#111}
input,textarea,select{width:100%;border:1px solid #d8d8dd;background:#fff;border-radius:12px;padding:11px;font:inherit;margin:5px 0 10px}
label{font-size:12px;color:#666;font-weight:650}
.bottom{position:absolute;bottom:0;left:0;right:0;height:82px;background:#ffffffdd;backdrop-filter:blur(20px);border-top:1px solid #ddd;display:flex;justify-content:space-around;align-items:center;z-index:10}
.bottom button{border:0;background:none;font-size:11px;color:#555}.bottom b{display:block;font-size:22px;color:#111}
.search{margin:0 14px 10px;background:#e5e5ea;border-radius:12px;padding:10px 13px;color:#777}
.listing{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #eee}.pic{width:76px;height:76px;border-radius:12px;background:#ddd;display:flex;align-items:center;justify-content:center;font-size:28px}
.avatar{width:44px;height:44px;border-radius:50%;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}
.payhero{background:linear-gradient(135deg,#0070ba,#003087);color:#fff;border-radius:0 0 28px 28px;padding:22px 18px 26px}.payhero .amount{font-size:38px}
.phhero{background:linear-gradient(145deg,#241046,#12121a);color:#fff;border-radius:0 0 28px 28px;padding:20px 18px 25px}.token{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #ffffff15}.coin{width:38px;height:38px;border-radius:50%;background:#fff2;display:flex;align-items:center;justify-content:center;font-weight:800}
.phbody{background:#12121a;color:#fff;min-height:100%;padding-bottom:100px}.phbody .apphead{background:#12121aeF}.phbody .card{background:#1d1d27;color:#fff}.phbody .muted{color:#aaa}
.markethead{background:#007782;color:#fff;padding:20px 18px 18px}.markethead h1{margin:0 0 14px;font-size:30px}.pill{display:inline-block;background:#fff2;color:#fff;padding:7px 10px;border-radius:99px;font-size:12px;margin-right:5px}
.modal{position:absolute;inset:0;background:#0007;z-index:50;display:none;align-items:flex-end}.sheet{background:#f7f7f8;border-radius:24px 24px 0 0;padding:20px;max-height:88%;overflow:auto;width:100%}.modal.show{display:flex}
.toast{position:absolute;top:58px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 14px;border-radius:99px;font-size:12px;z-index:100;display:none}
.demo{font-size:10px;color:#888;text-align:center;padding:8px}
hr{border:0;border-top:1px solid #eee}
</style>
</head>
<body>
<div class="phone">
<div class="status"><span id="clock">14:46</span><span>● ● ▰</span></div><div class="island"></div>
<div id="screen" class="screen"></div>
<div class="bottom" id="bottom">
<button onclick="home()"><b>⌂</b>Home</button>
<button onclick="openApp('vinted')"><b>V</b>Market</button>
<button onclick="openApp('paypal')"><b>₽</b>Pay</button>
<button onclick="openApp('phantom')"><b>◇</b>Crypto</button>
<button onclick="openApp('settings')"><b>⚙</b>Modifica</button>
</div>
<div id="modal" class="modal"><div class="sheet" id="sheet"></div></div>
<div id="toast" class="toast"></div>
</div>

<script>
const KEY='myphone_v3_state';
const defaults={
name:'Alex Rossi', balance:12480.50, paypal:2480.30,
vinted:{username:'alex.rossi',followers:184, listings:[
 {title:'Nike Air Max 1',price:120,emoji:'👟',status:'In vendita'},
 {title:'The North Face Puffer',price:180,emoji:'🧥',status:'In vendita'},
 {title:'Jordan Hoodie',price:75,emoji:'👕',status:'In vendita'}]},
transactions:[
 {text:'Vendita Nike Air Max 1',date:'Oggi, 12:41',amount:120},
 {text:'Pagamento stipendio',date:'30 set',amount:1850},
 {text:'Acquisto online',date:'29 set',amount:-74.90}],
paypalTx:[
 {text:'Pagamento ricevuto',date:'Oggi',amount:350},
 {text:'Invio a Marco',date:'Ieri',amount:-50}],
tokens:[
 {name:'Solana',symbol:'SOL',amount:12.48,price:188.42,emoji:'◎'},
 {name:'USD Coin',symbol:'USDC',amount:420.00,price:1,emoji:'$'},
 {name:'Ethereum',symbol:'ETH',amount:.42,price:3820,emoji:'◆'}],
theme:'light'
};
let state=JSON.parse(localStorage.getItem(KEY)||'null')||structuredClone(defaults);
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function money(n){return new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(n)}
function toast(t){let x=document.getElementById('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',1800)}
function home(){
document.getElementById('bottom').style.display='flex';
document.getElementById('screen').innerHTML=`<div class="home">
<div class="widgets">
<div class="widget"><div class="small">MyBank</div><div class="big">${money(state.balance)}</div><div class="muted">Saldo demo</div></div>
<div class="widget"><div class="small">PayPal</div><div class="big">${money(state.paypal)}</div><div class="muted">Saldo demo</div></div>
</div>
<div class="grid">
${[['vinted','V','i-v','Vinted'],['paypal','₽','i-p','PayPal'],['phantom','◇','i-ph','Phantom'],['settings','⚙','i-gray','Impostazioni'],['mail','✉','i-blue','Mail'],['chat','●','i-green','Messaggi'],['calendar','▦','i-red','Calendario'],['car','🚗','i-orange','Garage'],['homeapp','⌂','i-purple','Casa'],['work','▣','i-cyan','Lavoro'],['bank','€','i-green','Banca'],['notes','✎','i-gray','Note']].map(a=>`<button class="icon" onclick="openApp('${a[0]}')"><div class="iconbox ${a[2]}">${a[1]}</div><span>${a[3]}</span></button>`).join('')}
</div><div class="demo">MYPHONE ROLEPLAY • dati inventati • nessun pagamento reale</div>
</div>`;
}
function shell(title,body,cls=''){
document.getElementById('bottom').style.display='flex';
document.getElementById('screen').innerHTML=`<div class="app ${cls}"><div class="apphead"><button class="back" onclick="home()">‹ Home</button><h1>${title}</h1><span></span></div>${body}</div>`;
}
function openApp(a){
if(a==='vinted')return vinted();
if(a==='paypal')return paypal();
if(a==='phantom')return phantom();
if(a==='settings')return settings();
if(a==='mail')return generic('Mail','✉','Posta in arrivo','3 nuovi messaggi');
if(a==='chat')return generic('Messaggi','●','Conversazioni','12 chat');
if(a==='calendar')return generic('Calendario','▦','Agenda','Oggi • 2 appuntamenti');
if(a==='car')return generic('Garage','🚗','BMW M4','Parcheggiata • 12.482 km');
if(a==='homeapp')return generic('Casa','⌂','Casa','Milano • 3 locali');
if(a==='work')return generic('Lavoro','▣','Stipendio','€ 1.850 • prossimo pagamento 31 ott');
if(a==='bank')return bank();
if(a==='notes')return generic('Note','✎','La mia lista','Idee, acquisti, appuntamenti');
}
function vinted(){
shell('Vinted',`<div class="markethead"><h1>${state.vinted.username}</h1><span class="pill">${state.vinted.followers} follower</span><span class="pill">⭐ 5,0</span></div>
<div class="card"><div class="row"><div><div class="muted">Saldo Vinted</div><div class="amount">${money(state.balance)}</div></div><button class="btn" onclick="addSale()">+ Vendita</button></div></div>
<div class="search">⌕ Cerca articoli</div>
<div class="card"><div class="title">I tuoi articoli</div>${state.vinted.listings.map((x,i)=>`<div class="listing"><div class="pic">${x.emoji}</div><div style="flex:1"><div class="title">${x.title}</div><div class="muted">${x.status}</div><b>${money(x.price)}</b></div><button class="btn secondary" onclick="editListing(${i})">Modifica</button></div>`).join('')}</div>
<div class="card"><div class="title">Attività</div>${state.transactions.slice(0,5).map(t=>`<div class="row" style="padding:10px 0"><span>${t.text}<small class="muted" style="display:block">${t.date}</small></span><b>${t.amount>=0?'+':''}${money(t.amount)}</b></div>`).join('')}</div>
<div class="demo">SIMULAZIONE VINTED • nessun ordine, pagamento o spedizione reale</div>`);
}
function paypal(){
shell('PayPal',`<div class="payhero"><div class="muted" style="color:#cce8ff">Saldo PayPal</div><div class="amount">${money(state.paypal)}</div><div style="margin-top:18px"><button class="btn" style="background:#fff;color:#0070ba" onclick="paypalAction('send')">Invia</button> <button class="btn" style="background:#ffffff25" onclick="paypalAction('request')">Richiedi</button></div></div>
<div class="card"><div class="row"><div><b>Wallet</b><div class="muted">Carte e conti collegati</div></div><button class="btn secondary" onclick="editPay()">Modifica</button></div></div>
<div class="card"><div class="title">Attività</div>${state.paypalTx.map(t=>`<div class="row" style="padding:12px 0;border-bottom:1px solid #eee"><span>${t.text}<small class="muted" style="display:block">${t.date}</small></span><b>${t.amount>=0?'+':''}${money(t.amount)}</b></div>`).join('')}</div>
<div class="card"><div class="title">Funzioni demo</div><p class="muted">Invia • Richiedi • Ricevi • Wallet • Attività • notifiche</p></div>
<div class="demo">SIMULAZIONE PAYPAL • nessun trasferimento di denaro reale</div>`);
}
function phantom(){
let total=state.tokens.reduce((s,t)=>s+t.amount*t.price,0);
document.getElementById('bottom').style.display='flex';
document.getElementById('screen').innerHTML=`<div class="app phbody"><div class="apphead"><button class="back" style="color:#b68cff" onclick="home()">‹ Home</button><h1>Phantom</h1><span>•••</span></div>
<div class="phhero"><div class="muted" style="color:#bbb">Portafoglio</div><div class="amount">$${total.toLocaleString('en-US',{maximumFractionDigits:2})}</div><div style="margin-top:15px"><button class="btn" style="background:#fff;color:#6d3fe6" onclick="cryptoAction('buy')">Buy</button> <button class="btn" style="background:#ffffff18" onclick="cryptoAction('swap')">Swap</button> <button class="btn" style="background:#ffffff18" onclick="cryptoAction('send')">Send</button></div></div>
<div class="card"><div class="row"><b>Tokens</b><button class="btn secondary" onclick="addToken()">+ Token</button></div>${state.tokens.map((t,i)=>`<div class="token"><div class="coin">${t.emoji}</div><div style="flex:1"><b>${t.name}</b><div class="muted">${t.amount} ${t.symbol}</div></div><div style="text-align:right"><b>$${(t.amount*t.price).toFixed(2)}</b><div class="muted">$${t.price.toLocaleString()}</div></div><button class="btn secondary" onclick="editToken(${i})">✎</button></div>`).join('')}</div>
<div class="card"><b>Activity</b><p class="muted">Transazioni, swap, ricezioni e attività wallet possono essere simulate e modificate.</p></div>
<div class="demo" style="color:#aaa">SIMULAZIONE PHANTOM • nessuna blockchain o transazione reale</div></div>`;
}
function generic(title,ico,main,sub){shell(title,`<div class="card" style="text-align:center;padding:35px 18px"><div style="font-size:52px">${ico}</div><h2>${main}</h2><p class="muted">${sub}</p><button class="btn" onclick="toast('Funzione demo attivata')">Apri</button></div><div class="card"><b>Personalizza</b><p class="muted">Questa sezione può essere configurata dal pannello Modifica.</p></div>`)}
function bank(){shell('MyBank',`<div class="card"><div class="muted">Saldo</div><div class="amount">${money(state.balance)}</div></div><div class="card">${state.transactions.map(t=>`<div class="row" style="padding:12px 0"><span>${t.text}<small class="muted" style="display:block">${t.date}</small></span><b>${t.amount>=0?'+':''}${money(t.amount)}</b></div>`).join('')}</div>`)}
function settings(){shell('Modifica',`<div class="card"><b>Dati principali</b><label>Nome</label><input id="sname" value="${state.name}"><label>Saldo MyBank / Vinted</label><input id="sbal" type="number" step=".01" value="${state.balance}"><label>Saldo PayPal</label><input id="spay" type="number" step=".01" value="${state.paypal}"><button class="btn" onclick="saveSettings()">Salva modifiche</button></div>
<div class="card"><b>Profilo Vinted</b><label>Username</label><input id="vuser" value="${state.vinted.username}"><label>Follower</label><input id="vf" type="number" value="${state.vinted.followers}"><button class="btn" onclick="saveVinted()">Salva</button></div>
<div class="card"><b>Gestione rapida</b><button class="btn secondary" onclick="addSale()">Aggiungi vendita Vinted</button> <button class="btn secondary" onclick="resetAll()">Reset demo</button></div>
<div class="card"><b>Nota</b><p class="muted">Tutto resta nel browser tramite localStorage. Non vengono richieste password, seed phrase, carte o credenziali reali.</p></div>`)}
function saveSettings(){state.name=document.getElementById('sname').value;state.balance=+document.getElementById('sbal').value;state.paypal=+document.getElementById('spay').value;save();toast('Salvato');settings()}
function saveVinted(){state.vinted.username=document.getElementById('vuser').value;state.vinted.followers=+document.getElementById('vf').value;save();toast('Salvato');settings()}
function addSale(){let title=prompt('Nome articolo demo','Nike Air Force');if(!title)return;let p=+prompt('Prezzo (€)','100');if(!p)return;state.vinted.listings.unshift({title,price:p,emoji:'📦',status:'Venduto'});state.balance+=p;state.transactions.unshift({text:'Vendita '+title,date:'Oggi',amount:p});save();toast('Vendita simulata aggiunta');vinted()}
function editListing(i){let x=state.vinted.listings[i],t=prompt('Nome articolo',x.title);if(t!==null)x.title=t;let p=prompt('Prezzo',x.price);if(p!==null)x.price=+p;save();vinted()}
function editPay(){let p=prompt('Nuovo saldo PayPal',state.paypal);if(p!==null){state.paypal=+p;save();paypal()}}
function paypalAction(a){let p=+prompt(a==='send'?'Importo da inviare':'Importo da richiedere','50');if(!p)return;if(a==='send')state.paypal-=p;else state.paypal+=p;state.paypalTx.unshift({text:a==='send'?'Pagamento inviato':'Pagamento ricevuto',date:'Oggi',amount:a==='send'?-p:p});save();paypal()}
function addToken(){let n=prompt('Nome token','BONK');if(!n)return;let s=prompt('Ticker','BONK');let a=+prompt('Quantità','1000');let p=+prompt('Prezzo USD','0.00001');state.tokens.push({name:n,symbol:s,amount:a,price:p,emoji:'●'});save();phantom()}
function editToken(i){let x=state.tokens[i];let a=prompt('Quantità',x.amount);let p=prompt('Prezzo USD',x.price);if(a!==null)x.amount=+a;if(p!==null)x.price=+p;save();phantom()}
function cryptoAction(a){toast(a==='swap'?'Swap simulato':'Azione crypto simulata')}
function resetAll(){if(confirm('Ripristinare i dati demo?')){state=structuredClone(defaults);save();home()}}
function updateClock(){let d=new Date();document.getElementById('clock').textContent=d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})}
updateClock();setInterval(updateClock,30000);home();
</script>
</body>
</html>
